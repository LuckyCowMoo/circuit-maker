  <text x="900.0" y="108" text-anchor="middle" fill="#64748b" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Step-by-Step Drawing Guide for AND, OR &amp; NOT Gates (Circuit Maker Exact Geometry)</text>

  <!-- ==================== COLUMN 1: AND GATE ==================== -->
  <g id="and_column">
