<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840">
  <!-- Background -->
  <rect width="720" height="840" fill="#ffffff"/>
  <rect x="20" y="20" width="680" height="800" rx="24" fill="#fbfcff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="360.0" y="75" text-anchor="middle" fill="#0f2042" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold">How to Draw a NOT Gate</text>
  <text x="360.0" y="110" text-anchor="middle" fill="#64748b" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Circuit Maker Logic Gate Guide</text>

  <!-- STEP 1 -->
  <g id="step1">
    
    <g transform="translate(75, 200)">
      <circle cx="0" cy="0" r="18" fill="#0b8a82"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">1</text>
    </g>
    
    
    <line x1="105" y1="200" x2="160" y2="200" stroke="#0f2042" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="160,200 150,195 152,200 150,205" fill="#0f2042"/>
    

    <!-- Triangle Body -->
    <g transform="translate(220, 150)">
      <path d="M 0 0 L 100 50 L 0 100 Z" fill="none" stroke="#0b8a82" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Label & Arrow -->
    
    <line x1="375" y1="200" x2="280" y2="200" stroke="#0f2042" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="280,200 290,195 288,200 290,205" fill="#0f2042"/>
    
    <text x="395" y="208" fill="#0f2042" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold">Triangle Body</text>
  </g>

  <!-- STEP 2 -->
  <g id="step2">
    
    <g transform="translate(75, 420)">
      <circle cx="0" cy="0" r="18" fill="#f36f21"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">2</text>
    </g>
    
    
    <line x1="105" y1="420" x2="160" y2="420" stroke="#0f2042" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="160,420 150,415 152,420 150,425" fill="#0f2042"/>
    

    <!-- Triangle Body + NOT Bubble -->
    <g transform="translate(220, 370)">
      <path d="M 0 0 L 100 50 L 0 100 Z" fill="none" stroke="#0b8a82" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="112.5" cy="50" r="12.5" fill="none" stroke="#f36f21" stroke-width="5"/>
    </g>

    <!-- Label & Arrow -->
    
    <line x1="455" y1="420" x2="345" y2="420" stroke="#0f2042" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="345,420 355,415 353,420 355,425" fill="#0f2042"/>
    
    <text x="475" y="428" fill="#0f2042" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold">NOT Bubble</text>
  </g>

  <!-- STEP 3 -->
  <g id="step3">
    
    <g transform="translate(75, 660)">
      <circle cx="0" cy="0" r="18" fill="#0f2042"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">3</text>
    </g>
    
    
    <line x1="105" y1="660" x2="160" y2="660" stroke="#0f2042" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="160,660 150,655 152,660 150,665" fill="#0f2042"/>
    

    <!-- Complete Gate with Input & Output -->
    <g transform="translate(260, 610)">
      <!-- Input line (single input) -->
      <line x1="-50" y1="50" x2="0" y2="50" stroke="#0f2042" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Output line -->
      <line x1="125" y1="50" x2="180" y2="50" stroke="#0f2042" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Gate Body & Bubble -->
      <path d="M 0 0 L 100 50 L 0 100 Z" fill="none" stroke="#0b8a82" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="112.5" cy="50" r="12.5" fill="none" stroke="#f36f21" stroke-width="5"/>

      <!-- Input Label & Arrow -->
      
    <line x1="-25" y1="76" x2="-25" y2="58" stroke="#0f2042" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-25,58 -30,68 -25,66 -20,68" fill="#0f2042"/>
    
      <text x="-25" y="102" text-anchor="middle" fill="#0f2042" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold">Input</text>

      <!-- Output Label & Arrow -->
      
    <line x1="153" y1="76" x2="153" y2="58" stroke="#0f2042" stroke-width="3" stroke-linecap="round"/>
    <polygon points="153,58 148,68 153,66 158,68" fill="#0f2042"/>
    
      <text x="153" y="102" text-anchor="middle" fill="#0f2042" font-family="'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Quicksand', system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold">Output</text>
    </g>
  </g>
</svg>