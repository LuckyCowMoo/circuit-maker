<g transform="matrix(1 0 0 1 -20 -540)"><path d="M7 0C16.14 0 25.28 3.26 34.42 3.26C43.57 3.26 52.71 0 61.85 0C66.65 0 71.45 6.89 76.25 6.89C81.05 6.89 85.86 0 90.66 0C96.06 0 101.47 9.08 106.88 9.08C112.29 9.08 117.7 0 123.1 0C129.34 0 135.57 11.17 141.81 11.17C148.04 11.17 154.27 0 160.51 0C169.58 0 178.64 9.36 187.71 9.36C196.78 9.36 205.85 0 214.91 0C221.5 0 228.08 11.31 234.67 11.31C241.25 11.31 247.83 0 254.42 0C262.87 0 271.33 8.62 279.78 8.62C288.23 8.62 296.69 0 305.14 0C312.51 0 319.89 9.29 327.26 9.29C334.63 9.29 342 0 349.37 0C356.65 0 363.92 5.25 371.19 5.25C378.46 5.25 385.73 0 393 0C396.87 0 400 3.13 400 7C400 16.45 395.52 25.89 395.52 35.34C395.52 44.79 400 54.24 400 63.68C400 73.73 394.85 83.78 394.85 93.83C394.85 103.89 400 113.94 400 123.99C400 131.36 394.79 138.74 394.79 146.12C394.79 153.5 400 160.88 400 168.26C400 176.48 394.59 184.71 394.59 192.93C394.59 201.15 400 209.38 400 217.6C400 226.51 396.88 235.43 396.88 244.34C396.88 253.26 400 262.18 400 271.09C400 279.27 391.94 287.45 391.94 295.63C391.94 303.81 400 311.99 400 320.17C400 325.62 390.34 331.07 390.34 336.52C390.34 341.97 400 347.42 400 352.87C400 359.56 390.34 366.25 390.34 372.94C390.34 379.62 400 386.31 400 393C400 396.87 396.87 400 393 400C387.93 400 382.86 397.97 377.79 397.97C372.72 397.97 367.65 400 362.58 400C355.12 400 347.67 388.56 340.21 388.56C332.75 388.56 325.3 400 317.84 400C311.73 400 305.61 395.41 299.5 395.41C293.39 395.41 287.27 400 281.16 400C273.48 400 265.8 396.5 258.12 396.5C250.44 396.5 242.76 400 235.08 400C226.27 400 217.46 389.63 208.66 389.63C199.85 389.63 191.04 400 182.24 400C176.17 400 170.1 393.62 164.04 393.62C157.97 393.62 151.9 400 145.84 400C139.61 400 133.38 388.94 127.15 388.94C120.92 388.94 114.69 400 108.47 400C100.39 400 92.31 392.28 84.23 392.28C76.15 392.28 68.08 400 60 400C51.17 400 42.33 390.48 33.5 390.48C24.67 390.48 15.83 400 7 400C3.13 400 0 396.87 0 393C0 385.15 7.11 377.3 7.11 369.45C7.11 361.6 0 353.75 0 345.9C0 340.16 11.55 334.42 11.55 328.68C11.55 322.94 0 317.2 0 311.46C0 303.63 7.81 295.8 7.81 287.97C7.81 280.14 0 272.31 0 264.48C0 254.58 10.28 244.68 10.28 234.77C10.28 224.87 0 214.97 0 205.07C0 199.74 3.22 194.41 3.22 189.09C3.22 183.76 0 178.43 0 173.1C0 167.5 8.41 161.9 8.41 156.3C8.41 150.69 0 145.09 0 139.49C0 131.07 11.8 122.64 11.8 114.22C11.8 105.79 0 97.37 0 88.95C0 81.43 10.94 73.91 10.94 66.39C10.94 58.87 0 51.35 0 43.83C0 37.69 8.53 31.55 8.53 25.41C8.53 19.28 0 13.14 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="55.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Turns a 2-bit number</text><text x="200" y="81.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">into a single 1 on one of</text><text x="200" y="108.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">four outputs.</text><text x="200" y="134.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: Each AND gate matches</text><text x="200" y="160.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">one pattern of S0 and S1.</text><text x="200" y="186.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">NOT gates supply the 0s that</text><text x="200" y="213.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">pattern needs. Only one</text><text x="200" y="239.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">pattern can match at a time.</text><text x="200" y="265.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: Decoders pick one</text><text x="200" y="291.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">device out of many: a memory</text><text x="200" y="318.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">row, a digit, or one</text><text x="200" y="344.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">operation in a control unit.</text></g>
