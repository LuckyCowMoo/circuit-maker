07 0 221.75 0 214.43C0 205.37 6.13 196.31 6.13 187.25C6.13 178.19 0 169.13 0 160.07C0 155 8.52 149.94 8.52 144.87C8.52 139.8 0 134.74 0 129.67C0 120.7 8.97 111.74 8.97 102.77C8.97 93.81 0 84.84 0 75.87C0 64.39 7 52.92 7 41.44C7 29.96 0 18.48 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="55.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Lights Open only when</text><text x="200" y="81.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">the switches show one code:</text><text x="200" y="108.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">C0 on, C1 off, C2 on, C3 on.</text><text x="200" y="134.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: C0, C2, and C3 must be</text><text x="200" y="160.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">1. C1 must be 0, so a NOT</text><text x="200" y="186.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">watches that switch. One AND</text><text x="200" y="213.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">lights Open only when all</text><text x="200" y="239.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">four match.</text><text x="200" y="265.625" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: The same pattern check</text><text x="200" y="291.875" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">opens a door, enables a</text><text x="200" y="318.125" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">mode, or matches an</text><text x="200" y="344.375" font-size="21" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">instruction.</text></g>
