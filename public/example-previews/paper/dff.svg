<g transform="matrix(1 0 0 1 -20 -610)"><path d="M7 0C13.05 0 19.1 1.94 25.15 1.94C31.2 1.94 37.25 0 43.3 0C50.92 0 58.53 8.33 66.15 8.33C73.76 8.33 81.37 0 88.99 0C96.65 0 104.3 11.27 111.96 11.27C119.62 11.27 127.28 0 134.94 0C141.4 0 147.86 6.42 154.32 6.42C160.79 6.42 167.25 0 173.71 0C180.9 0 188.09 6.74 195.28 6.74C202.46 6.74 209.65 0 216.84 0C225.17 0 233.49 7.12 241.82 7.12C250.14 7.12 258.47 0 266.8 0C276.16 0 285.53 3.66 294.9 3.66C304.27 3.66 313.64 0 323 0C334.67 0 346.34 11.83 358 11.83C369.67 11.83 381.33 0 393 0C396.87 0 400 3.13 400 7C400 15.92 388.67 24.84 388.67 33.76C388.67 42.68 400 51.59 400 60.51C400 65.5 396.63 70.48 396.63 75.46C396.63 80.44 400 85.42 400 90.41C400 95.18 396.38 99.95 396.38 104.73C396.38 109.5 400 114.27 400 119.04C400 129.31 389.59 139.59 389.59 149.86C389.59 160.13 400 170.4 400 180.67C400 189.37 391.22 198.07 391.22 206.77C391.22 215.48 400 224.18 400 232.88C400 237.79 394.56 242.71 394.56 247.62C394.56 252.54 400 257.45 400 262.36C400 269.77 388.54 277.18 388.54 284.59C388.54 292 400 299.41 400 306.82C400 321.19 393.47 335.55 393.47 349.91C393.47 364.27 400 378.64 400 393C400 396.87 396.87 400 393 400C386.26 400 379.51 395.71 372.77 395.71C366.02 395.71 359.28 400 352.54 400C345.49 400 338.44 389.37 331.39 389.37C324.34 389.37 317.29 400 310.24 400C300.66 400 291.08 390.42 281.49 390.42C271.91 390.42 262.33 400 252.74 400C247.43 400 242.11 392.74 236.79 392.74C231.48 392.74 226.16 400 220.84 400C215.14 400 209.44 392.7 203.74 392.7C198.04 392.7 192.34 400 186.64 400C181.36 400 176.09 396.37 170.81 396.37C165.53 396.37 160.26 400 154.98 400C147.06 400 139.14 397.89 131.22 397.89C123.3 397.89 115.37 400 107.45 400C100.1 400 92.74 397.86 85.39 397.86C78.03 397.86 70.68 400 63.32 400C53.93 400 44.55 393.64 35.16 393.64C25.77 393.64 16.39 400 7 400C3.13 400 0 396.87 0 393C0 388.1 3.36 383.19 3.36 378.29C3.36 373.39 0 368.48 0 363.58C0 354.65 3.54 345.73 3.54 336.8C3.54 327.88 0 318.95 0 310.03C0 302.74 11.3 295.46 11.3 288.17C11.3 280.88 0 273.6 0 266.31C0 259.27 2.59 252.22 2.59 245.18C2.59 238.13 0 231.09 0 224.04C0 215.6 5.24 207.15 5.24 198.71C5.24 190.26 0 181.82 0 173.37C0 164.51 7.49 155.64 7.49 146.77C7.49 137.91 0 129.04 0 120.17C0 111.31 6.55 102.46 6.55 93.6C6.55 84.74 0 75.88 0 67.02C0 57.02 11.39 47.02 11.39 37.01C11.39 27.01 0 17 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="50" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Copies D into Q at the</text><text x="200" y="75" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">moment Clock turns on, then</text><text x="200" y="100" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">holds it.</text><text x="200" y="125" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: Two latches in a row.</text><text x="200" y="150" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">The master is open while</text><text x="200" y="175" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Clock is off. The slave opens</text><text x="200" y="200" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">when Clock turns on, and that</text><text x="200" y="225" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">is the instant Q updates.</text><text x="200" y="250" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: Edge-triggered memory</text><text x="200" y="275" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">lets registers and counters</text><text x="200" y="300" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">change once per tick, instead</text><text x="200" y="325" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">of flickering while the input</text><text x="200" y="350" font-size="20" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">moves.</text></g>
