328.38 0 319.51 0 310.64C0 303.23 1.8 295.83 1.8 288.42C1.8 281.02 0 273.62 0 266.21C0 256.11 7.41 246.01 7.41 235.91C7.41 225.81 0 215.71 0 205.61C0 197.82 1.9 190.03 1.9 182.24C1.9 174.45 0 166.66 0 158.87C0 150.22 3.03 141.58 3.03 132.94C3.03 124.3 0 115.66 0 107.02C0 96.71 2.77 86.4 2.77 76.09C2.77 65.78 0 55.47 0 45.16C0 38.8 2.58 32.44 2.58 26.08C2.58 19.72 0 13.36 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="57.5" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Lights Odd when a 4-bit</text><text x="200" y="81.25" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">number contains an odd count of</text><text x="200" y="105" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">1s.</text><text x="200" y="128.75" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: XOR is 1 when its two</text><text x="200" y="152.5" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">inputs differ. The bits are</text><text x="200" y="176.25" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">paired, then the two pair</text><text x="200" y="200" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">results are XORed. That final</text><text x="200" y="223.75" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">bit is 1 exactly when the whole</text><text x="200" y="247.5" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">number has an odd number of 1s.</text><text x="200" y="271.25" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: Parity catches a bit that</text><text x="200" y="295" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">flipped in memory or on a wire.</text><text x="200" y="318.75" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">An even count leaves the lamp</text><text x="200" y="342.5" font-size="19" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">off.</text></g>
