1.1 0 262.86C0 253.78 4.04 244.7 4.04 235.61C4.04 226.53 0 217.44 0 208.36C0 200.6 7.55 192.84 7.55 185.09C7.55 177.33 0 169.57 0 161.81C0 153.54 7.6 145.26 7.6 136.99C7.6 128.71 0 120.44 0 112.16C0 103.71 10.45 95.27 10.45 86.82C10.45 78.38 0 69.93 0 61.48C0 55.61 11.02 49.73 11.02 43.85C11.02 37.98 0 32.1 0 26.23C0 23.02 7.71 19.82 7.71 16.61C7.71 13.41 0 10.2 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="48.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Remembers one bit. S</text><text x="200" y="76.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">sets it, R resets it.</text><text x="200" y="103.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: Two NOR gates feed</text><text x="200" y="131.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">each other. Pressing S</text><text x="200" y="158.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">forces Q on. Pressing R</text><text x="200" y="186.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">forces Q off. With both</text><text x="200" y="213.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">released, each gate holds</text><text x="200" y="241.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">the other where it is.</text><text x="200" y="268.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: This is the smallest</text><text x="200" y="296.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">memory. Do not press S and</text><text x="200" y="323.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">R together: both outputs</text><text x="200" y="351.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">would be forced off.</text></g>
