.86C8.86 263.67 0 255.49 0 247.3C0 237.63 7.81 227.96 7.81 218.3C7.81 208.63 0 198.96 0 189.29C0 182.56 6.29 175.83 6.29 169.09C6.29 162.36 0 155.62 0 148.89C0 139.64 6.82 130.4 6.82 121.16C6.82 111.92 0 102.67 0 93.43C0 86.38 11.89 79.33 11.89 72.28C11.89 65.24 0 58.19 0 51.14C0 43.78 8.86 36.43 8.86 29.07C8.86 21.71 0 14.36 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="48.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Adds two bits plus a</text><text x="200" y="76.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">carry coming in from the</text><text x="200" y="103.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">bit on the right.</text><text x="200" y="131.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: One half adder adds A</text><text x="200" y="158.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">and B. A second half adder</text><text x="200" y="186.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">adds that sum to Cin. An</text><text x="200" y="213.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">OR joins the two little</text><text x="200" y="241.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">carries into Cout.</text><text x="200" y="268.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: Chain the carry from</text><text x="200" y="296.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">one full adder into the</text><text x="200" y="323.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">next and you can add</text><text x="200" y="351.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">numbers of any length.</text></g>
