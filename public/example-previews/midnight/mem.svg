1C6.94 289.74 0 281.38 0 273.02C0 267.67 7.05 262.32 7.05 256.98C7.05 251.63 0 246.28 0 240.93C0 233.65 10.5 226.38 10.5 219.1C10.5 211.83 0 204.55 0 197.28C0 191.03 7.54 184.79 7.54 178.55C7.54 172.3 0 166.06 0 159.81C0 154.03 9.94 148.25 9.94 142.46C9.94 136.68 0 130.89 0 125.11C0 115.75 4.55 106.39 4.55 97.04C4.55 87.68 0 78.33 0 68.97C0 58.64 2.64 48.31 2.64 37.98C2.64 27.66 0 17.33 0 7C0 3.13 3.13 0 7 0Z" fill="#ffe08a" stroke="#0b1b46" stroke-width="1.8"/><text x="200" y="48.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">What: Stores one bit, and</text><text x="200" y="76.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">only changes it while</text><text x="200" y="103.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Write is held.</text><text x="200" y="131.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">How: While Write is on, Q</text><text x="200" y="158.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">follows D. When Write is</text><text x="200" y="186.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">released, the crossed</text><text x="200" y="213.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">gates keep Q as it was.</text><text x="200" y="241.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">Why: This is one cell of a</text><text x="200" y="268.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">register or of RAM. Write</text><text x="200" y="296.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">when you mean to, then</text><text x="200" y="323.75" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">leave the value sitting</text><text x="200" y="351.25" font-size="22" font-weight="700" fill="#0b1b46" text-anchor="middle" dominant-baseline="middle">there.</text></g>
